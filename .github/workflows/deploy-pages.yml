name: Deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out game
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Copy game files
        run: |
          mkdir -p _site
          cp index.html site.webmanifest arena-logo.svg preview-image.png _site/
          cp -r css js icons _site/
          # Cache-bust: stamp every local css/js URL with this commit's short SHA
          # so browsers and the Pages CDN never serve stale copies after a deploy.
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+\.(css|js))\"#\1=\"\2?v=${V}\"#g" _site/index.html
          grep -c "?v=${V}" _site/index.html
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
